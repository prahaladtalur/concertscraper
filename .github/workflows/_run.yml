# Shared runner for the scheduled jobs.
#
# GitHub Actions has no YAML anchors, so without a reusable workflow the poll
# and report schedules would each carry their own copy of this env block and
# drift apart the first time a setting changes. Callers pass `secrets: inherit`.
name: run

on:
  workflow_call:
    inputs:
      commands:
        description: Newline-separated `python -m app.cli ...` invocations
        required: true
        type: string

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      # --- Required secrets ---
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      TICKETMASTER_API_KEY: ${{ secrets.TICKETMASTER_API_KEY }}

      # --- Optional: artist demand signal ---
      SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
      SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}

      # --- Email delivery ---
      SMTP_HOST: ${{ secrets.SMTP_HOST }}
      SMTP_USER: ${{ secrets.SMTP_USER }}
      SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
      EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
      EMAIL_TO: ${{ secrets.EMAIL_TO }}
      SMTP_PORT: ${{ vars.SMTP_PORT || '587' }}
      SMTP_USE_TLS: ${{ vars.SMTP_USE_TLS || 'true' }}
      # Set the EMAIL_DRY_RUN repo variable to "true" to render digests to the
      # run artifact instead of emailing them. Useful for a first live test.
      EMAIL_DRY_RUN: ${{ vars.EMAIL_DRY_RUN || 'false' }}

      # --- Optional: SMS on large position moves ---
      TWILIO_ACCOUNT_SID: ${{ secrets.TWILIO_ACCOUNT_SID }}
      TWILIO_AUTH_TOKEN: ${{ secrets.TWILIO_AUTH_TOKEN }}
      TWILIO_FROM_NUMBER: ${{ secrets.TWILIO_FROM_NUMBER }}
      SMS_TO: ${{ secrets.SMS_TO }}
      SMS_DAILY_SUMMARY: ${{ vars.SMS_DAILY_SUMMARY || 'false' }}
      POSITION_MOVE_ALERT_PCT: ${{ vars.POSITION_MOVE_ALERT_PCT || '0.15' }}

      # --- Tuning (repo variables, all optional) ---
      MARKET_DMA_IDS: ${{ vars.MARKET_DMA_IDS || '324' }}
      CLASSIFICATION_NAME: ${{ vars.CLASSIFICATION_NAME || 'Music' }}
      LOOKAHEAD_DAYS: ${{ vars.LOOKAHEAD_DAYS || '240' }}
      ALERT_SCORE_THRESHOLD: ${{ vars.ALERT_SCORE_THRESHOLD || '0.62' }}
      ALERT_COOLDOWN_HOURS: ${{ vars.ALERT_COOLDOWN_HOURS || '48' }}
      MAX_ALERTS_PER_EMAIL: ${{ vars.MAX_ALERTS_PER_EMAIL || '12' }}
      ENABLE_AXS: 'false'

    steps:
      - uses: actions/checkout@v7

      # Distinguishes "not set up yet" from "set up and broken".
      #
      # Before this ran, an unconfigured repo failed every scheduled poll —
      # eight red runs and eight failure emails a day, for a setup step that
      # simply hadn't happened. That trains you to ignore the notifications,
      # which is exactly backwards for a tool whose only real failure mode is
      # silently stopping.
      #
      # No secrets at all -> skip the run quietly, because nothing is wrong yet.
      # Some but not all -> fail loudly, because that IS a misconfiguration.
      - name: Check configuration
        id: cfg
        run: |
          have=0; missing=
          for name in DATABASE_URL TICKETMASTER_API_KEY; do
            eval "value=\${$name:-}"
            if [ -n "$value" ]; then have=$((have + 1)); else missing="$missing $name"; fi
          done

          if [ "$have" -eq 0 ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Not configured yet — skipping. Add the DATABASE_URL and TICKETMASTER_API_KEY secrets to start collecting prices (see docs/DEPLOY.md)."
            exit 0
          fi

          if [ -n "$missing" ]; then
            echo "::error::Partially configured — missing:$missing"
            echo "Add the missing secrets, or remove the others to pause the schedule cleanly." >&2
            exit 1
          fi

          echo "configured=true" >> "$GITHUB_OUTPUT"
          if [ "$EMAIL_DRY_RUN" != "true" ] && [ -z "$SMTP_HOST" ]; then
            echo "::warning::SMTP_HOST unset — emails will be written to the run artifact instead of sent."
          fi

      - uses: actions/setup-python@v7
        if: steps.cfg.outputs.configured == 'true'
        with:
          python-version: '3.11'
          cache: pip

      - run: pip install -r requirements.txt
        if: steps.cfg.outputs.configured == 'true'

      - name: Verify database and API credentials
        if: steps.cfg.outputs.configured == 'true'
        run: python -m app.cli preflight

      - name: Create tables if needed
        if: steps.cfg.outputs.configured == 'true'
        run: python -m app.cli init

      - name: Run
        if: steps.cfg.outputs.configured == 'true'
        run: |
          set -euo pipefail
          # `|| [ -n "$cmd" ]` so a final line without a trailing newline still
          # runs instead of being silently dropped.
          while IFS= read -r cmd || [ -n "$cmd" ]; do
            [ -z "$cmd" ] && continue
            echo "::group::$cmd"
            python -m app.cli $cmd
            echo "::endgroup::"
          done <<'COMMANDS'
          ${{ inputs.commands }}
          COMMANDS

      # Rendered emails only exist on disk in dry-run mode; uploading them
      # unconditionally means a misconfigured send is still inspectable.
      - name: Upload rendered emails
        if: always() && hashFiles('outbox/**') != ''
        uses: actions/upload-artifact@v7
        with:
          name: outbox-${{ github.run_id }}
          path: outbox/
          retention-days: 14

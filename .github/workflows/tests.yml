name: tests

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements.txt
      # The suite mocks all HTTP and uses in-memory SQLite, so it needs no
      # secrets and no database.
      - run: python -m pytest -q
      - run: python -m pyflakes app/ tests/
        continue-on-error: true
